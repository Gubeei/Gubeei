<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recess Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0b1d;--bg2:#131230;--panel:#1a1940;--line:#2c2a5c;--text:#f3f1ff;--muted:#a19fd0;--pink:#ff4fa3;--cyan:#33e1ff;--lime:#b6ff3b;--yellow:#ffd23f;--orange:#ff8a3d;--violet:#8b5cff}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Fredoka,system-ui,sans-serif;color:var(--text);background:var(--bg);min-height:100vh;
  background-image:radial-gradient(circle at 15% -10%,rgba(139,92,255,.35),transparent 45%),radial-gradient(circle at 100% 0%,rgba(255,79,163,.22),transparent 40%),linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
  background-size:auto,auto,32px 32px,32px 32px;background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

/* ---------- home ---------- */
header.top{padding:38px 0 6px}
.logo{font-family:'Press Start 2P',monospace;font-size:clamp(20px,4.2vw,36px);line-height:1.35;margin:0;background:linear-gradient(90deg,var(--cyan),var(--violet),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(139,92,255,.45))}
.tag{color:var(--muted);font-size:18px;margin:12px 0 0}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:26px 0 22px}
.search{flex:1 1 260px;position:relative}
.search input{width:100%;padding:14px 16px 14px 46px;border-radius:14px;border:2px solid var(--line);background:var(--bg2);color:var(--text);font:inherit;font-size:17px;outline:none}
.search input:focus{border-color:var(--violet)}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);opacity:.6}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:var(--bg2);padding:9px 16px;border-radius:999px;font-weight:600;font-size:15px;color:var(--muted);transition:.15s}
.chip:hover{color:var(--text);border-color:#46438a}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.rand{border:none;padding:12px 18px;border-radius:14px;font-weight:700;background:linear-gradient(135deg,var(--pink),var(--orange));color:#fff;box-shadow:0 6px 0 #9c2860;transition:transform .1s,box-shadow .1s}
.rand:active{transform:translateY(4px);box-shadow:0 2px 0 #9c2860}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px;padding-bottom:36px}
.card{background:var(--panel);border:2px solid var(--line);border-radius:20px;overflow:hidden;text-align:left;padding:0;transition:transform .15s,border-color .15s,box-shadow .15s;display:flex;flex-direction:column}
.card:hover,.card:focus-visible{transform:translateY(-4px);border-color:var(--c);box-shadow:0 14px 30px -12px var(--c);outline:none}
.thumb{height:130px;width:100%;display:grid;place-items:center;font-size:64px;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.35),transparent 55%),var(--g);position:relative}
.thumb span{filter:drop-shadow(0 6px 8px rgba(0,0,0,.35));transition:transform .2s}
.card:hover .thumb span{transform:scale(1.12) rotate(-6deg)}
.cat{position:absolute;top:10px;left:10px;font-style:normal;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:rgba(0,0,0,.35);padding:4px 10px;border-radius:999px;color:#fff}
.meta{padding:14px 16px 16px}
.meta h3{margin:0 0 4px;font-size:20px}
.meta p{margin:0;color:var(--muted);font-size:14.5px;line-height:1.35}
.meta .best{margin-top:10px;font-size:13px;font-weight:600;color:var(--yellow)}
.empty{color:var(--muted);text-align:center;padding:40px;grid-column:1/-1;font-size:18px}
footer{color:var(--muted);text-align:center;padding:6px 0 40px;font-size:14px}

/* ---------- player ---------- */
#player{display:none}
body.playing #home{display:none}
body.playing #player{display:block}
.pbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:22px 0 16px}
.btn{border:2px solid var(--line);background:var(--bg2);padding:10px 16px;border-radius:12px;font-weight:600}
.btn:hover{border-color:var(--violet)}
.btn.primary{background:var(--violet);border-color:var(--violet);color:#fff}
.ptitle{font-size:26px;font-weight:700;margin:0 auto 0 6px;display:flex;align-items:center;gap:10px}
.stat{background:var(--bg2);border:2px solid var(--line);border-radius:12px;padding:5px 14px;text-align:center;min-width:86px}
.stat small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat b{font-size:20px}
.playarea{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;align-items:start;padding-bottom:40px}
@media (max-width:860px){.playarea{grid-template-columns:1fr}}
@media (max-width:600px){.ptitle{order:-1;flex-basis:100%;margin:0 0 4px;font-size:22px}.stat{min-width:70px;padding:4px 10px}}
.stage{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:20px;min-height:440px;display:flex;flex-direction:column;align-items:center;gap:14px}
.side{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:18px 20px}
.side h4{margin:0 0 8px;font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.side ul{margin:0 0 18px;padding-left:18px;line-height:1.5}
.side .more{display:grid;gap:8px}
.mini{display:flex;align-items:center;gap:10px;border:2px solid var(--line);background:var(--bg2);border-radius:12px;padding:8px 10px;text-align:left;font-weight:600}
.mini:hover{border-color:var(--violet)}
.mini i{font-style:normal;font-size:20px;width:36px;height:36px;display:grid;place-items:center;border-radius:10px;background:var(--g)}
.gstatus{min-height:26px;font-weight:600;color:var(--muted);text-align:center;font-size:17px}
.gcanvas{width:100%;height:auto;border-radius:14px;display:block;touch-action:none;background:#000;cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:none;background:var(--bg2);padding:9px 14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--violet);color:#fff}
.dpad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,50px);gap:6px;touch-action:none}
.dpad button{border:2px solid var(--line);background:var(--bg2);border-radius:12px;font-size:20px}
.dpad button:active{background:var(--violet)}
@media (hover:hover) and (pointer:fine){.dpad{display:none}}
.ov{position:absolute;inset:0;background:rgba(12,11,29,.86);display:grid;place-items:center;text-align:center;border-radius:16px;animation:fade .25s;z-index:5}
.ov h3{font-size:30px;margin:0 0 6px}.ov p{color:var(--muted);margin:0 0 14px}
@keyframes fade{from{opacity:0}}

/* 2048 */
.b2048{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;background:#28265a;padding:10px;border-radius:16px;width:100%;aspect-ratio:1;touch-action:none}
.b2048 div{border-radius:10px;background:rgba(255,255,255,.06);display:grid;place-items:center;font-weight:700;font-size:clamp(20px,7vw,38px);color:#fff}
.b2048 .pop{animation:pop .16s ease-out}.b2048 .merge{animation:bump .16s}
@keyframes pop{from{transform:scale(.3);opacity:0}}
@keyframes bump{50%{transform:scale(1.12)}}

/* tic tac toe */
.ttt{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(100%,340px);aspect-ratio:1}
.ttt button{border:none;border-radius:16px;background:var(--bg2);font-size:clamp(40px,12vw,72px);font-weight:700;line-height:1;transition:background .15s}
.ttt button:hover{background:#1f1d4a}
.ttt .x{color:var(--cyan)}.ttt .o{color:var(--pink)}
.ttt .win{background:#2f2a6b;box-shadow:inset 0 0 0 3px var(--yellow)}

/* memory */
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:min(100%,420px)}
.mcard{aspect-ratio:1;perspective:600px;border:none;background:none;padding:0}
.mcard .in{position:relative;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.mcard.flip .in{transform:rotateY(180deg)}
.mcard .f,.mcard .b{position:absolute;inset:0;border-radius:14px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.mcard .f{background:linear-gradient(135deg,var(--violet),var(--pink));font-size:28px;font-weight:700;color:rgba(255,255,255,.8)}
.mcard .b{background:var(--bg2);transform:rotateY(180deg);font-size:clamp(28px,8vw,46px);border:2px solid var(--line)}
.mcard.done .b{border-color:var(--lime);box-shadow:0 0 16px -4px var(--lime)}

/* minesweeper */
.ms{display:grid;gap:3px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.ms button{width:var(--s);height:var(--s);border:none;border-radius:6px;background:#3d3a88;font-weight:700;font-size:calc(var(--s) * .52);padding:0;box-shadow:inset 0 -3px 0 rgba(0,0,0,.28);line-height:1;-webkit-touch-callout:none}
.ms button:hover{background:#4a46a0}
.ms button.r{background:#1d1b42;box-shadow:none}
.ms button.boom{background:#ff4f6d}

/* whack */
.whack{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:min(100%,420px)}
.hole{aspect-ratio:1;border:none;padding:0;border-radius:22px;background:linear-gradient(#3fa34d 0 20%,#6b4a2b 20%,#4a321c);position:relative;overflow:hidden;touch-action:manipulation}
.hole::after{content:'';position:absolute;left:12%;right:12%;bottom:12%;height:26%;border-radius:50%;background:#1a0f08}
.hole::before{content:'';position:absolute;left:0;right:0;bottom:0;height:20%;background:#4a321c;z-index:2}
.hole span{position:absolute;left:0;right:0;bottom:-80%;font-size:clamp(38px,11vw,62px);transition:bottom .12s ease-out,transform .1s;z-index:1;line-height:1;text-align:center;pointer-events:none}
.hole.up span{bottom:18%}
.hole.hit span{transform:scale(.8) rotate(-12deg);filter:brightness(1.6)}

/* simon */
.simon{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:min(100%,360px);aspect-ratio:1;border-radius:50%;overflow:hidden;padding:14px;background:#0d0c22;box-shadow:0 0 0 4px var(--line)}
.pad{border:none;opacity:.42;transition:opacity .08s,filter .08s;touch-action:manipulation}
.pad.lit{opacity:1;filter:brightness(1.25)}

/* reaction */
.react{width:100%;min-height:340px;border-radius:18px;border:none;font-size:clamp(28px,6vw,44px);font-weight:700;color:#fff;display:grid;place-items:center;text-align:center;padding:20px;touch-action:manipulation;user-select:none}
.react small{display:block;font-size:17px;font-weight:500;opacity:.9;margin-top:8px}

/* typing */
.typetext{font-size:clamp(17px,2.6vw,22px);line-height:1.7;background:var(--bg2);border-radius:14px;padding:18px 20px;width:100%;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--muted)}
.typetext .ok{color:var(--lime)}
.typetext .bad{color:#fff;background:#ff4f6d;border-radius:3px}
.typetext .cur{border-bottom:3px solid var(--yellow);color:var(--text)}
.typein{width:100%;padding:14px 16px;font:inherit;font-size:18px;border-radius:12px;border:2px solid var(--line);background:var(--bg2);color:var(--text);outline:none}
.typein:focus{border-color:var(--violet)}

/* connect four */
.c4{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;background:linear-gradient(#3156e0,#2341b8);padding:10px;border-radius:18px;width:min(100%,460px);box-shadow:0 10px 0 #182d85}
.c4 .cell{aspect-ratio:1;border-radius:50%;background:var(--bg);position:relative;overflow:hidden;border:none;padding:0}
.c4 .cell.hov{background:#25235a}
.c4 .cell i{position:absolute;inset:7%;border-radius:50%}
.c4 .p1 i{background:radial-gradient(circle at 35% 35%,#ff9ab0,#ff2e63 60%)}
.c4 .p2 i{background:radial-gradient(circle at 35% 35%,#fff1a8,#ffc107 60%)}
.c4 .drop i{animation:drop .28s cubic-bezier(.5,0,1,1)}
.c4 .win i{box-shadow:0 0 0 4px #fff inset,0 0 14px #fff}
@keyframes drop{from{transform:translateY(-120%)}}
</style>
</head>
<body>

<div id="home" class="wrap">
  <header class="top">
    <h1 class="logo">RECESS ARCADE</h1>
    <p class="tag" id="tagline"></p>
  </header>
  <div class="toolbar">
    <label class="search">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="q" type="search" placeholder="Search games…" aria-label="Search games">
    </label>
    <div class="chips" id="chips"></div>
    <button class="rand" id="random">🎲 Surprise me</button>
  </div>
  <main class="grid" id="grid"></main>
  <footer>Made with plain HTML, CSS &amp; JavaScript · Best scores are saved in this browser only</footer>
</div>

<section id="player" class="wrap">
  <div class="pbar">
    <button class="btn" id="back">← All games</button>
    <h2 class="ptitle"><span id="pemoji"></span><span id="pname"></span></h2>
    <div class="stat"><small id="slabel">Score</small><b id="sval">0</b></div>
    <div class="stat"><small id="blabel">Best</small><b id="bval">–</b></div>
    <button class="btn" id="mute" aria-label="Toggle sound">🔊</button>
    <button class="btn primary" id="restart">↻ Restart</button>
  </div>
  <div class="playarea">
    <div class="stage" id="stage"></div>
    <aside class="side">
      <h4>How to play</h4>
      <ul id="howto"></ul>
      <h4>Try another</h4>
      <div class="more" id="more"></div>
    </aside>
  </div>
</section>

<script>
/* ================= helpers ================= */
const $=s=>document.querySelector(s);
function h(tag,attrs,...kids){const e=document.createElement(tag);attrs=attrs||{};for(const k in attrs){const v=attrs[k];if(k==='class')e.className=v;else if(k==='style')e.style.cssText=v;else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);else e.setAttribute(k,v)}for(const c of kids.flat()){if(c==null)continue;e.append(c.nodeType?c:document.createTextNode(c))}return e}
const rnd=n=>Math.floor(Math.random()*n);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const store={get(k,d){try{const v=localStorage.getItem('recess_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('recess_'+k,JSON.stringify(v))}catch(e){}}};
const KEYDIR={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};

let actx=null,muted=store.get('muted',false);
function beep(f=440,d=.08,type='square',vol=.05){if(muted)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,actx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d+.02)}catch(e){}}

function mkCanvas(ctx,W,H){const dpr=Math.min(2,window.devicePixelRatio||1);const c=document.createElement('canvas');c.width=W*dpr;c.height=H*dpr;c.className='gcanvas';c.style.maxWidth=W+'px';const g=c.getContext('2d');g.scale(dpr,dpr);ctx.el.append(c);return{c,g,pos(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}}}
function rr(g,x,y,w,hh,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+hh,r);g.arcTo(x+w,y+hh,x,y+hh,r);g.arcTo(x,y+hh,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function banner(g,W,H,title,sub){g.fillStyle='rgba(12,11,29,.62)';g.fillRect(0,0,W,H);g.textAlign='center';g.fillStyle='#fff';g.font='bold 32px Fredoka, sans-serif';g.fillText(title,W/2,H/2-6);g.font='500 17px Fredoka, sans-serif';g.fillStyle='#d4d1ff';g.fillText(sub,W/2,H/2+26)}
function mkSeg(opts,val,fn){const s=h('div',{class:'seg'});opts.forEach(([v,l])=>{const b=h('button',{class:v===val?'on':''},l);b.addEventListener('click',()=>{if(b.classList.contains('on'))return;[...s.children].forEach(x=>x.classList.remove('on'));b.classList.add('on');b.blur();fn(v)});s.append(b)});return s}
function mkDpad(ctx,fn){const p=h('div',{class:'dpad'});[['up','▲',2,1],['left','◀',1,2],['down','▼',2,2],['right','▶',3,2]].forEach(([d,l,c,r])=>{const b=h('button',{'aria-label':d,style:`grid-column:${c};grid-row:${r}`},l);ctx.on(b,'pointerdown',e=>{e.preventDefault();fn(d)});p.append(b)});ctx.el.append(p);return p}
function swipe(ctx,el,fn){let sx=null,sy=null;ctx.on(el,'touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY},{passive:true});ctx.on(el,'touchmove',e=>{if(sx!=null)e.preventDefault()},{passive:false});ctx.on(el,'touchend',e=>{if(sx==null)return;const t=e.changedTouches[0];const dx=t.clientX-sx,dy=t.clientY-sy;sx=null;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;fn(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'))})}

/* ================= games ================= */
const GAMES=[

/* ---------- SNAKE ---------- */
{id:'snake',name:'Snake',emoji:'🐍',cat:'Arcade',c:'#1fd17a',g:'linear-gradient(135deg,#1fd17a,#0a7f63)',
desc:'Eat apples, grow longer, and don’t bite your own tail.',
how:['Arrow keys or WASD to steer. On a phone, swipe or use the arrow pad.','Each apple is +1 and speeds you up a little.','Hitting a wall or yourself ends the run.'],
init(ctx){
  const W=400,N=20,S=W/N;const{c,g}=mkCanvas(ctx,W,W);
  const V={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};
  let snake,dir,q,food,score,state,acc,overAt=0;
  const place=()=>{do{food={x:rnd(N),y:rnd(N)}}while(snake.some(s=>s.x===food.x&&s.y===food.y))};
  const reset=()=>{snake=[{x:8,y:10},{x:7,y:10},{x:6,y:10}];dir={x:1,y:0};q=[];score=0;acc=0;ctx.score(0);place();state='ready';ctx.status('Press an arrow key (or swipe) to start')};
  const turn=d=>{if(state==='over'){if(performance.now()-overAt<450)return;reset()}
    if(state==='ready'){state='play';ctx.status('')}
    const v=V[d],last=q.length?q[q.length-1]:dir;
    if((v.x===-last.x&&v.y===-last.y)||(v.x===last.x&&v.y===last.y))return;
    if(q.length<3)q.push(v)};
  const step=()=>{if(q.length)dir=q.shift();const hd={x:snake[0].x+dir.x,y:snake[0].y+dir.y};const eat=hd.x===food.x&&hd.y===food.y;const body=eat?snake:snake.slice(0,-1);
    if(hd.x<0||hd.y<0||hd.x>=N||hd.y>=N||body.some(s=>s.x===hd.x&&s.y===hd.y)){state='over';overAt=performance.now();beep(140,.3,'sawtooth');const nb=ctx.report(score);ctx.status((nb?'🏆 New best! ':'')+'Press an arrow key to play again');return}
    snake.unshift(hd);if(eat){score++;ctx.score(score);beep(660,.06);place()}else snake.pop()};
  const draw=()=>{g.fillStyle='#0f1f1a';g.fillRect(0,0,W,W);g.fillStyle='#132a21';for(let y=0;y<N;y++)for(let x=y%2;x<N;x+=2)g.fillRect(x*S,y*S,S,S);
    g.fillStyle='#ff4f6d';g.beginPath();g.arc(food.x*S+S/2,food.y*S+S/2+1,S*.38,0,7);g.fill();g.fillStyle='#3fd17a';g.fillRect(food.x*S+S/2-1,food.y*S+1,3,5);
    snake.forEach((s,i)=>{const t=i/snake.length;g.fillStyle=`hsl(${145-t*35},78%,${56-t*16}%)`;rr(g,s.x*S+1,s.y*S+1,S-2,S-2,6);g.fill()});
    const hd=snake[0];g.fillStyle='#fff';(dir.y!==0?[[-4,0],[4,0]]:[[0,-4],[0,4]]).forEach(([ox,oy])=>{g.beginPath();g.arc(hd.x*S+S/2+ox+dir.x*3,hd.y*S+S/2+oy+dir.y*3,2.6,0,7);g.fill()});
    if(state==='ready')banner(g,W,W,'SNAKE','Arrow keys / swipe to start');

  const place=(i,p)=>{b[i]=p;btns[i].textContent=p;btns[i].className=p.toLowerCase();beep(p==='X'?520:380,.05,'triangle');const w=win(b);if(w){end(w);return true}return false};

{id:'connect4',name:'Connect Four',emoji:'🔴',cat:'Strategy',c:'#ffc107',g:'linear-gradient(135deg,#3156e0,#ff2e63)',
label:'Wins',bestLabel:'Best streak',
desc:'Drop discs and line up four before the computer does.',
how:['Click a column to drop your 🔴 disc.','Get four in a row — across, down, or diagonal.','Hard mode thinks several moves ahead.'],
init(ctx){
  const R=6,C=7;let B,over,busy,wins=0,streak=0,first=1,pend=null,diff=store.get('c4_diff','hard');
  const seg=mkSeg([['easy','Easy'],['hard','Hard']],diff,v=>{diff=v;store.set('c4_diff',v);newRound()});
  const board=h('div',{class:'c4'});const cells=[];
  const again=h('button',{class:'btn primary',style:'visibility:hidden'},'Next round →');ctx.on(again,'click',()=>newRound());
  ctx.el.append(seg,board,again);
  const hover=c=>cells.forEach(d=>d.classList.toggle('hov',+d.dataset.c===c&&!over&&!busy));
  for(let r=0;r<R;r++)for(let c=0;c<C;c++){const d=h('button',{class:'cell','aria-label':'column '+(c+1)},h('i'));d.dataset.c=c;cells.push(d);board.append(d);ctx.on(d,'click',()=>human(c));ctx.on(d,'mouseenter',()=>hover(c))}
  ctx.on(board,'mouseleave',()=>hover(-1));
  const drop=(b,c)=>{for(let r=R-1;r>=0;r--)if(!b[r][c])return r;return -1};
  const valid=b=>[3,2,4,1,5,0,6].filter(c=>!b[0][c]);
  const lines=[];for(let r=0;r<R;r++)for(let c=0;c<C;c++)for(const[dr,dc]of[[0,1],[1,0],[1,1],[1,-1]]){const er=r+3*dr,ec=c+3*dc;if(er>=0&&er<R&&ec>=0&&ec<C)lines.push([0,1,2,3].map(k=>[r+k*dr,c+k*dc]))}
  const winner=b=>{for(const l of lines){const v=b[l[0][0]][l[0][1]];if(v&&l.every(([r,c])=>b[r][c]===v))return{p:v,l}}return null};
  const evalB=b=>{let s=0;for(let r=0;r<R;r++){if(b[r][3]===2)s+=3;else if(b[r][3]===1)s-=3}
    for(const l of lines){let a=0,o=0;for(const[r,c]of l){const v=b[r][c];if(v===2)a++;else if(v===1)o++}if(a&&o)continue;if(a===3)s+=5;else if(a===2)s+=2;if(o===3)s-=6;else if(o===2)s-=2}return s};
  const mm=(b,d,al,be,max)=>{const w=winner(b);if(w)return w.p===2?100000+d:-100000-d;const mv=valid(b);if(!mv.length)return 0;if(d===0)return evalB(b);
    if(max){let v=-Infinity;for(const c of mv){const r=drop(b,c);b[r][c]=2;v=Math.max(v,mm(b,d-1,al,be,false));b[r][c]=0;al=Math.max(al,v);if(al>=be)break}return v}
    let v=Infinity;for(const c of mv){const r=drop(b,c);b[r][c]=1;v=Math.min(v,mm(b,d-1,al,be,true));b[r][c]=0;be=Math.min(be,v);if(al>=be)break}return v};
  const cpuMove=()=>{const mv=valid(B);if(diff==='easy'&&Math.random()<.35)return mv[rnd(mv.length)];const depth=diff==='easy'?1:5;let best=-Infinity,bc=mv[0];
    for(const c of mv){const r=drop(B,c);B[r][c]=2;const v=mm(B,depth,-Infinity,Infinity,false);B[r][c]=0;if(v>best){best=v;bc=c}}return bc};
  const place=(c,p)=>{const r=drop(B,c);if(r<0)return false;B[r][c]=p;const d=cells[r*C+c];d.classList.add('p'+p,'drop');beep(p===1?300:240,.06,'triangle');
    const w=winner(B);if(w){end(w);return 'end'}if(!valid(B).length){end(null);return 'end'}return 'ok'};
  const end=w=>{over=true;hover(-1);if(!w)ctx.status('Board full — it’s a draw!');else{w.l.forEach(([r,c])=>cells[r*C+c].classList.add('win'));
    if(w.p===1){wins++;streak++;ctx.score(wins);ctx.report(streak);ctx.status('You connected four! 🎉')}else{streak=0;ctx.status('CPU connected four.')}}again.style.visibility='visible'};
  const cpuTurn=delay=>{busy=true;hover(-1);ctx.status('CPU is thinking…');pend=ctx.after(()=>{const res=place(cpuMove(),2);busy=false;if(res!=='end')ctx.status('Your turn — you are 🔴')},delay)};
  const human=c=>{if(over||busy)return;const res=place(c,1);if(!res||res==='end')return;cpuTurn(320)};
  const newRound=()=>{clearTimeout(pend);B=[...Array(R)].map(()=>Array(C).fill(0));over=false;busy=false;cells.forEach(d=>d.className='cell');again.style.visibility='hidden';
    if(first===2)cpuTurn(450);else ctx.status('Your turn — you are 🔴');first=first===1?2:1};
  ctx.score(0);newRound();
}},

{id:'whack',name:'Whack-a-Mole',emoji:'🔨',cat:'Reflex',c:'#ff8a3d',g:'linear-gradient(135deg,#ff8a3d,#8a4b1c)',
desc:'30 seconds. Bop the critters, grab the stars, dodge the bombs.',

init(ctx){
  const grid=h('div',{class:'whack'});const holes=[];
  for(let i=0;i<9;i++){const sp=h('span');const b=h('button',{class:'hole','aria-label':'hole'},sp);holes.push({b,sp,up:false,hit:false,kind:null,timer:null});grid.append(b)}
  const start=h('button',{class:'btn primary'},'▶ Start');ctx.el.append(grid,start);
  let score=0,running=false,endAt=0,popT=null,tick=null;
  const prog=()=>1-Math.max(0,endAt-Date.now())/30000;
  const down=ho=>{clearTimeout(ho.timer);ho.up=false;ho.hit=false;ho.b.classList.remove('up','hit')};
  const hit=ho=>{if(!running||!ho.up||ho.hit)return;ho.hit=true;ho.b.classList.add('hit');
    if(ho.kind==='bomb'){score=Math.max(0,score-3);beep(120,.2,'sawtooth')}else if(ho.kind==='star'){score+=3;beep(1200,.08)}else{score++;beep(800,.05)}
    ctx.score(score);clearTimeout(ho.timer);ho.timer=ctx.after(()=>down(ho),200)};
  const pop=()=>{if(!running)return;const free=holes.filter(x=>!x.up);
    if(free.length){const ho=free[rnd(free.length)];const r=Math.random();ho.kind=r<.15?'bomb':r<.23?'star':'mole';ho.sp.textContent=ho.kind==='bomb'?'💣':ho.kind==='star'?'⭐':'🐹';ho.up=true;ho.hit=false;ho.b.classList.add('up');ho.timer=ctx.after(()=>{if(!ho.hit)down(ho)},1000-prog()*480)}
    popT=ctx.after(pop,(720-prog()*400)*(.6+Math.random()*.6))};
  holes.forEach(ho=>ctx.on(ho.b,'pointerdown',e=>{e.preventDefault();hit(ho)}));
  ctx.on(start,'click',()=>{if(running)return;start.blur();clearTimeout(popT);score=0;ctx.score(0);running=true;endAt=Date.now()+30000;start.disabled=true;start.textContent='Whack!';pop();
    tick=ctx.every(()=>{const l=Math.max(0,Math.ceil((endAt-Date.now())/1000));ctx.status('⏱ '+l+'s left');
      if(Date.now()>=endAt){running=false;clearInterval(tick);clearTimeout(popT);holes.forEach(down);const nb=ctx.report(score);ctx.status(`Time! You scored ${score}.`+(nb?' 🏆 New best!':''));start.disabled=false;start.textContent='▶ Play again'}},100)});
  ctx.score(0);ctx.status('Hit 🐹 (+1) and ⭐ (+3). Avoid 💣 (−3)!');
}},

/* ================= app shell ================= */
const CATS=['All','Arcade','Puzzle','Strategy','Reflex','Skill'];
const gridEl=$('#grid'),stage=$('#stage'),sval=$('#sval'),bval=$('#bval'),slabel=$('#slabel'),blabel=$('#blabel');
let cat='All',query='',current=null,ctx=null;
const fmtBest=(g,v)=>g.fmt?g.fmt(v):String(v);

$('#tagline').textContent=`${GAMES.length} free games to play right in your browser. No downloads, no sign-ups, no ads.`;

function renderChips(){const el=$('#chips');el.innerHTML='';CATS.forEach(c=>el.append(h('button',{class:'chip'+(c===cat?' on':''),onclick:()=>{cat=c;renderChips();renderGrid()}},c)))}
function renderGrid(){
  const q=query.trim().toLowerCase();
  const list=GAMES.filter(g=>(cat==='All'||g.cat===cat)&&(g.name+' '+g.desc+' '+g.cat).toLowerCase().includes(q));
  gridEl.innerHTML='';
  if(!list.length){gridEl.append(h('div',{class:'empty'},'No games match that search 🤔'));return}
  list.forEach(g=>{const best=store.get('best_'+g.id+(g.cardSub?'_'+g.cardSub:''),null);
    gridEl.append(h('button',{class:'card',style:`--c:${g.c};--g:${g.g}`,onclick:()=>go(g.id)},
      h('div',{class:'thumb'},h('span',{},g.emoji),h('em',{class:'cat'},g.cat)),
      h('div',{class:'meta'},h('h3',{},g.name),h('p',{},g.desc),best!=null?h('div',{class:'best'},'🏆 '+(g.bestLabel||'Best')+': '+fmtBest(g,best)):null)))});
}

function startGame(g){
  if(ctx)ctx.stop();stage.innerHTML='';const cl=[];
  ctx={el:stage,
    on(t,ev,fn,o){t.addEventListener(ev,fn,o);cl.push(()=>t.removeEventListener(ev,fn,o))},
    every(fn,ms){const i=setInterval(fn,ms);cl.push(()=>clearInterval(i));return i},
    after(fn,ms){const i=setTimeout(fn,ms);cl.push(()=>clearTimeout(i));return i},
    loop(fn){let alive=true,last=performance.now(),id;const step=t=>{if(!alive)return;const dt=Math.min(.034,Math.max(0,(t-last)/1000));last=t;fn(dt);id=requestAnimationFrame(step)};id=requestAnimationFrame(step);cl.push(()=>{alive=false;cancelAnimationFrame(id)})},
    score(v){sval.textContent=v},label(s){slabel.textContent=s},
    status(s){statusEl.textContent=s},
    key(sub){return 'best_'+g.id+(sub?'_'+sub:'')},
    showBest(sub){const v=store.get(ctx.key(sub),null);bval.textContent=v==null?'–':fmtBest(g,v)},
    report(v,sub){const k=ctx.key(sub),old=store.get(k,null);const better=old==null?(g.low?true:v>0):(g.low?v<old:v>old);if(better){store.set(k,v);ctx.showBest(sub)}return better&&old!=null},
    restart(){startGame(g)},
    stop(){cl.splice(0).forEach(f=>{try{f()}catch(e){}})}};
  slabel.textContent=g.label||'Score';blabel.textContent=g.bestLabel||'Best';sval.textContent='0';ctx.showBest();
  const statusEl=h('div',{class:'gstatus'});stage.append(statusEl);
  g.init(ctx);
}
function openGame(g){
  if(current===g)return;current=g;document.body.classList.add('playing');
  $('#pemoji').textContent=g.emoji;$('#pname').textContent=g.name;
  const how=$('#howto');how.innerHTML='';g.how.forEach(x=>how.append(h('li',{},x)));
  const more=$('#more');more.innerHTML='';shuffle(GAMES.filter(x=>x!==g)).slice(0,4).forEach(x=>more.append(h('button',{class:'mini',style:`--g:${x.g}`,onclick:()=>go(x.id)},h('i',{},x.emoji),x.name)));
  document.title=g.name+' · Recess Arcade';window.scrollTo(0,0);startGame(g);
}
function closeGame(){if(ctx)ctx.stop();ctx=null;current=null;stage.innerHTML='';document.body.classList.remove('playing');document.title='Recess Arcade';renderGrid()}
function route(){const g=GAMES.find(x=>x.id===location.hash.slice(1));if(g)openGame(g);else if(current)closeGame()}
function go(id){try{location.hash=id}catch(e){}route()}
window.addEventListener('hashchange',route);

$('#q').addEventListener('input',e=>{query=e.target.value;renderGrid()});
$('#random').addEventListener('click',()=>go(GAMES[rnd(GAMES.length)].id));
$('#back').addEventListener('click',()=>{try{history.replaceState(null,'',location.pathname+location.search)}catch(e){try{location.hash=''}catch(e2){}}closeGame()});
$('#restart').addEventListener('click',e=>{e.currentTarget.blur();if(current)startGame(current)});
const muteBtn=$('#mute');const paintMute=()=>muteBtn.textContent=muted?'🔇':'🔊';paintMute();
muteBtn.addEventListener('click',()=>{muted=!muted;store.set('muted',muted);paintMute();muteBtn.blur()});
document.addEventListener('keydown',e=>{if(!document.body.classList.contains('playing'))return;const t=e.target.tagName;if(t==='INPUT'||t==='TEXTAREA')return;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault()},true);

renderChips();renderGrid();route();
</script>
</body>
</html>
